name: T2 apk
'on':
  workflow_dispatch: null
permissions:
  contents: write
env:
  PPSSPP_REPO: https://github.com/hrydgard/ppsspp.git
  PPSSPP_TAG: v1.18.1
  ANDROID_API: '21'
  VERSION: ${{ inputs.version || '1.0.0-rf1' }}
jobs:
  apk:
    name: assemble + sign APK
    needs: cores
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@v4
    - name: Collect all core artefacts
      uses: actions/download-artifact@v4
      with:
        pattern: core-*
        path: dist/cores-downloaded
        merge-multiple: false
    - name: Arrange cores as jniLibs (lib/cores/<abi>)
      run: "set -euo pipefail\nmkdir -p ppsspp/lib/cores/arm64-v8a ppsspp/lib/cores/armeabi-v7a\n\
        for d in dist/cores-downloaded/core-*; do\n  case \"$d\" in\n    *arm64-v8a)\
        \    cp -v \"$d\"/*.so ppsspp/lib/cores/arm64-v8a/ ;;\n    *armeabi-v7a) \
        \ cp -v \"$d\"/*.so ppsspp/lib/cores/armeabi-v7a/ ;;\n  esac\ndone\ndu -sh\
        \ ppsspp/lib/cores/*\necho \"## packaged cores\" >> $GITHUB_STEP_SUMMARY\n\
        ls -1 ppsspp/lib/cores/arm64-v8a | sed 's/^/arm64: /' >> $GITHUB_STEP_SUMMARY\n\
        ls -1 ppsspp/lib/cores/armeabi-v7a | sed 's/^/armv7: /' >> $GITHUB_STEP_SUMMARY\n"
    - name: Clone PPSSPP with submodules
      run: "set -euo pipefail\n# The ppsspp/ directory was created above for cores;\
        \ move it aside,\n# clone into ppsspp-src and copy the cores in afterwards.\n\
        mv ppsspp/lib ppsspp-lib\ngit clone --recurse-submodules --depth 1 --branch\
        \ \"$PPSSPP_TAG\" \\\n  \"$PPSSPP_REPO\" ppsspp-src\nmkdir -p ppsspp-src/lib\n\
        cp -r ppsspp-lib/cores ppsspp-src/lib/cores\ngit -C ppsspp-src submodule update\
        \ --init --recursive\ngit -C ppsspp-src rev-parse HEAD | tee ppsspp-commit.txt\n"
    - name: Integrate RetroFusion sources + patches
      run: 'set -euo pipefail

        chmod +x scripts/integrate-ppsspp.sh

        scripts/integrate-ppsspp.sh ppsspp-src

        '
    - name: Fail if the PSP core was modified
      run: "set -euo pipefail\ncd ppsspp-src\n# Requirement 7a / 12.6: the PSP emulation\
        \ core must be untouched.\nif [ -n \"$(git status --porcelain -- Core/ ':(exclude)Core/RetroFusion')\"\
        \ ]; then\n  echo \"ERROR: files under Core/ were modified\" >&2\n  git status\
        \ --porcelain -- Core/ >&2\n  exit 1\nfi\necho \"ok: Core/ untouched\"\n"
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Install NDK matching PPSSPP's ndkVersion
      run: 'yes | sdkmanager --licenses > /dev/null || true

        sdkmanager "ndk;21.4.7075529" "cmake;3.22.1"

        '
    - name: Decode keystore from secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.RETROFUSION_KEYSTORE_BASE64 }}
      run: "set -euo pipefail\nif [ -z \"${KEYSTORE_BASE64:-}\" ]; then\n  echo \"\
        ::error::RETROFUSION_KEYSTORE_BASE64 secret is missing - refusing to produce\
        \ an unsigned build\"\n  exit 1\nfi\necho \"$KEYSTORE_BASE64\" | base64 -d\
        \ > \"$RUNNER_TEMP/retrofusion.jks\"\necho \"keystore decoded ($(stat -c%s\
        \ \"$RUNNER_TEMP/retrofusion.jks\") bytes)\"\n"
    - name: Build release APKs (per ABI)
      env:
        RELEASE_KEY_STORE: ${{ runner.temp }}/retrofusion.jks
        RELEASE_KEY_ALIAS: ${{ secrets.RETROFUSION_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RETROFUSION_KEY_PASSWORD }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RETROFUSION_STORE_PASSWORD }}
      run: "set -euo pipefail\ncd ppsspp-src\nchmod +x gradlew\n# --no-daemon keeps\
        \ memory use predictable on a 4 GB runner.\n./gradlew --no-daemon assembleNormalRelease\
        \ \\\n  -PANDROID_VERSION_NAME=\"$VERSION\" \\\n  -PANDROID_VERSION_CODE=\"\
        ${GITHUB_RUN_NUMBER}0\"\n"
    - name: Verify size, signature and ABI
      run: 'set -euo pipefail

        chmod +x scripts/package-apk.sh

        scripts/package-apk.sh ppsspp-src dist/apk "$VERSION"

        '
    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: RetroFusion-APKs
        path: 'dist/apk/*.apk

          dist/apk/SHA256SUMS.txt

          dist/apk/BUILD-REPORT.txt

          '
        if-no-files-found: error
    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        name: RetroFusion release
        body_path: dist/apk/BUILD-REPORT.txt
        files: 'dist/apk/*.apk

          dist/apk/SHA256SUMS.txt

          '
