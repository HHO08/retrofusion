name: T1 cores
'on':
  workflow_dispatch: null
permissions:
  contents: write
env:
  PPSSPP_REPO: https://github.com/hrydgard/ppsspp.git
  PPSSPP_TAG: v1.18.1
  ANDROID_API: '21'
  VERSION: ${{ inputs.version || '1.0.0-rf1' }}
jobs:
  cores:
    name: core ${{ matrix.core }} (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        abi:
        - arm64-v8a
        - armeabi-v7a
        core:
        - fceumm
        - gambatte
        - mgba
        - snes9x
        - picodrive
        - genesis_plus_gx
        - mupen64plus_next
        - melonds
        - flycast
        - mednafen_saturn
        - mednafen_psx
        - opera
        - puae
        - fbneo
        - bluemsx
        - mednafen_wswan
        - mednafen_ngp
        - np2kai
        - mednafen_pcfx
        - mednafen_pce_fast
        - mednafen_pce
        - dosbox_pure
        - scummvm
        - desmume
        exclude:
        - abi: arm64-v8a
          core: desmume
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r26c
        add-to-path: false
    - name: Build core
      env:
        ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      run: 'set -euo pipefail

        chmod +x scripts/build-core.sh

        scripts/build-core.sh "${{ matrix.core }}" "${{ matrix.abi }}" "dist/cores/${{
        matrix.abi }}"

        ls -l "dist/cores/${{ matrix.abi }}"

        '
    - name: Upload core artefact
      uses: actions/upload-artifact@v4
      with:
        name: core-${{ matrix.core }}-${{ matrix.abi }}
        path: dist/cores/${{ matrix.abi }}/*.so
        if-no-files-found: error
        retention-days: 7
